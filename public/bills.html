<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="description" content="Pay ECG electricity, Ghana Water, DStv, GOtv and StarTimes with Mobile Money or card. Check the name on the account before you pay." />
<meta name="format-detection" content="telephone=no" />
<title>Pay bills — Abrants Data Store</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css?v=7" />
<link rel="stylesheet" href="/css/services.css?v=6" />
</head>
<body class="has-mobilebar sv-page">

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Abrants Data Store home">
      <img class="brand-logo" src="/icon.svg" alt="" width="38" height="38" />
      <span><strong>ABRANTS</strong><small>DATA STORE</small></span>
    </a>
    <div class="nav-actions">
      <a href="/" class="track-link">Buy data</a>
    </div>
  </div>
</header>

<section class="sv-top">
  <div class="wrap sv-col">
    <h1>Pay bills</h1>
    <div class="sv-switch" id="blSwitch" role="tablist" aria-label="Which bill?" hidden>
      <button role="tab" id="tabEcg" aria-controls="blPane" aria-selected="true" data-kind="ecg">Electricity</button>
      <button role="tab" id="tabWater" aria-controls="blPane" aria-selected="false" data-kind="water">Water</button>
      <button role="tab" id="tabTv" aria-controls="blPane" aria-selected="false" data-kind="tv">TV</button>
    </div>
  </div>
</section>

<main class="wrap sv-col sv-main">
  <div id="svLoading" class="sv-loading"><span class="spinner"></span></div>

  <form id="blPane" class="sv-pane" role="tabpanel" novalidate hidden>
    <div class="bl-providers" id="blProviders" role="group" aria-label="TV provider" hidden>
      <button type="button" data-service="DSTV" aria-pressed="true">DStv</button>
      <button type="button" data-service="GOTV" aria-pressed="false">GOtv</button>
      <button type="button" data-service="STARTIMES" aria-pressed="false">StarTimes</button>
    </div>
    <label class="field" for="blAccount"><span id="blAccountLabel">Meter number</span>
      <span class="bl-check-row">
        <input id="blAccount" name="account" inputmode="numeric" autocomplete="off" maxlength="24" placeholder="0210444711" spellcheck="false" />
        <button type="button" class="bl-check" id="blCheck">Check</button>
      </span>
    </label>

    <div class="bl-who" id="blWho" hidden aria-live="polite">
      <span class="bl-tick" aria-hidden="true">✓</span>
      <div class="bl-who-txt"><strong id="blName"></strong><small id="blArea"></small></div>
      <button type="button" class="bl-change" id="blChange">Change</button>
    </div>
    <p class="bl-due" id="blDue" hidden></p>

    <div id="blRest" hidden>
      <label class="field" for="blAmount"><span>Amount (GH₵)</span>
        <input id="blAmount" name="amount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="50" />
      </label>
      <div class="bl-chips" id="blChips" role="group" aria-label="Quick amounts"></div>

      <label class="field"><span>Phone number</span>
        <input type="tel" name="phone" id="blPhone" inputmode="numeric" maxlength="10" placeholder="0241234567" autocomplete="tel-national" /></label>
      <label class="field"><span>Email</span>
        <input type="email" name="email" id="blEmail" placeholder="you@example.com" autocomplete="email" /></label>

      <button class="pay-btn" type="submit" id="blPay">Pay</button>
      <p class="sv-fee" id="blFee" hidden></p>
    </div>
    <p class="ck-error" id="blError" role="alert" hidden></p>
  </form>

  <div id="svEmpty" class="sv-empty" hidden>
    <p>Bill payments open here soon.</p>
    <a class="pay-btn" href="/">Buy data instead</a>
  </div>

  <section id="svResult" class="sv-result" aria-live="polite" hidden></section>
  <nav id="svRecent" class="sv-recent" aria-label="Your bill payments" hidden></nav>
  <a class="sv-help" id="svHelp" href="#" target="_blank" rel="noopener" hidden>Chat with support</a>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <span>© <span id="year">2026</span> Abrants Data Store</span>
    <span>Payments by Paystack</span>
  </div>
</footer>

<div class="mobilebar">
  <a class="bar-cta" href="/">Buy data</a>
  <a class="bar-icon" href="/services.html" aria-label="Result checkers and AFA">🎓</a>
  <a class="bar-icon" href="/account.html" aria-label="My account">👤</a>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<script src="/js/bills.js?v=3"></script>
</body>
</html>
